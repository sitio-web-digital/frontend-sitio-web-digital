server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta sirve index.html — el ruteo real lo hace React
    # (HashRouter para el panel, o el hostname detection de App.jsx para
    # páginas públicas de clientes).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
