name: Deploy frontend (self-hosted)

# Solo develop dispara deploy automático por ahora, mismo criterio que el
# backend (ver backend-sitio-web-digital/.github/workflows/deploy-backend.yml).
on:
  push:
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  IMAGE_NAME: sitioweb-frontend
  CONTAINER_NAME: sitioweb-frontend
  HOST_PORT: 8081

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build de la imagen
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" -t "$IMAGE_NAME:latest" .

      - name: Sacar el contenedor anterior
        run: docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

      - name: Levantar el contenedor nuevo
        run: |
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$HOST_PORT:80" \
            "$IMAGE_NAME:latest"

      - name: Esperar a que responda
        run: |
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:${HOST_PORT}/" >/dev/null; then
              echo "Frontend arriba."
              exit 0
            fi
            sleep 2
          done
          echo "::error::El frontend no respondió a tiempo."
          docker logs --tail 100 "$CONTAINER_NAME"
          exit 1

      - name: Limpiar imágenes viejas
        run: docker image prune -f
