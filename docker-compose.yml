services:
  db:
    image: postgres:16-alpine
    container_name: sitiowebdigital-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitioweb
      POSTGRES_PASSWORD: sitioweb_dev
      POSTGRES_DB: sitioweb_digital
    ports:
      - "5435:5432"
    volumes:
      - sitiowebdigital_pgdata:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitioweb -d sitioweb_digital"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sitiowebdigital_pgdata:
